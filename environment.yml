name: mito-spatial
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - pandas>=2
  - scipy>=1.11
  - matplotlib>=3.8
  - seaborn>=0.13
  - scanpy>=1.10
  - anndata>=0.10
  - jax>=0.4
  - pillow>=10
  - plotly>=5
  - fpdf
  - scrublet>=0.2
  - r-base>=4.3
  - r-seurat>=5
  - r-seuratobject
  - r-matrix
  - r-data.table
  - r-dplyr
  - r-tidyr
  - r-tibble
  - r-ggplot2
  - r-ggrepel
  - r-patchwork
  - r-readr
  - r-readxl
  - r-stringr
  - r-forcats
  - r-viridis
  - r-reticulate
  - r-devtools
  - r-remotes
  - r-fnn
  - r-pheatmap
  - r-spdep
  - r-uwot
  - r-reshape2
  - r-scales
  - r-paletteer
  - bioconductor-singlecellexperiment
  - bioconductor-spatialexperiment
  - bioconductor-scater
  - bioconductor-scran
  - bioconductor-slingshot
  - bioconductor-noiseq
